name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --coverage

  validate-infra:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt -check
        working-directory: infra
        run: terraform fmt -check -diff
      - name: terraform init & validate
        working-directory: infra
        run: |
          # function.zip só existe de verdade após `npm run package` (job de
          # deploy); aqui é só um placeholder para o `filebase64sha256(...)`
          # do main.tf ter um arquivo para ler durante a validação de sintaxe.
          touch ../function.zip
          terraform init -backend=false
          terraform validate

  deploy:
    name: Deploy (Lambda + API Gateway)
    needs: [build-test, validate-infra]
    # Só roda depois que o usuário configurar a conta AWS e os secrets — ver README.
    # Defina a variável de repositório AWS_DEPLOY_ENABLED=true quando estiver pronto.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run package

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init & apply
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve
